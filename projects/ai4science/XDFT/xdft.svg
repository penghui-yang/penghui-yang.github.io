<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-labelledby="title desc">
<title id="title">XDFT: evidence-guided mechanism discovery</title>
<desc id="desc">Experiment-simulation mismatches motivate executable hypotheses. Calculation results are evaluated against experiments and feed back into hypothesis refinement.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#547b5b"/></marker></defs>
<rect width="460" height="260" rx="10" fill="#f0f7f2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#225573">
<text x="230" y="32" font-size="21" font-weight="600">XDFT</text>
<text x="230" y="57" font-size="15">Experiment–simulation mismatch</text>
<g fill="#fff" stroke="#bdcec3"><rect x="24" y="89" width="175" height="72" rx="6"/><rect x="261" y="89" width="175" height="72" rx="6"/></g>
<g font-size="17"><text x="112" y="118">Executable</text><text x="112" y="141">hypotheses</text><text x="348" y="118">DFT</text><text x="348" y="141">calculations</text></g>
<g fill="none" stroke="#547b5b" stroke-width="2" marker-end="url(#arrow)"><path d="M204 124H254"/><path d="M347 169V209H112V169"/></g>
<text x="230" y="240" font-size="15">Evaluate evidence · Refine mechanisms</text>
</g></svg>
